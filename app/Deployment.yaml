apiVersion: apps/v1
kind: Deployment
metadata:
  name: Streamlit-deployment
spec:
  selector:
    matchLabels:
      app: fullstack
  replicas: 3
  template:
    metadata:
      labels:
        app: fullstack
    spec:
      containers:
      - name: fullstack
        image: shabdoc/streamlit-app:5adcb05079ea975a1094d5bc9035a9f4df1818f9
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"